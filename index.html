<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - FotoFerrara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/theme.css">

    <style>
        .page-body {
            padding: 40px 60px;
            flex-grow: 1;
        }

        .page-title-block {
            margin-bottom: 30px;
        }

        .page-title-block h1 {
            font-size: 26px;
            color: var(--color-primary);
        }

        .page-title-block p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .stock-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: var(--transition);
        }

        .stock-card:hover {
            transform: translateY(-3px);
        }

        .stock-card h3 {
            font-size: 14px;
            letter-spacing: 0.6px;
            color: var(--color-accent);
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-main);
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stock-item:last-of-type {
            border-bottom: none;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-cream);
            color: var(--color-primary);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .qty-btn:hover {
            background-color: var(--color-light-brown);
            border-color: var(--color-accent);
        }

        .stock-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .stock-actions .primary-btn,
        .stock-actions .outline-btn {
            flex: 1;
            padding: 9px;
            font-size: 13px;
        }
    </style>
</head>
<body class="animated-view">
    <div id="site-header"></div>

    <main class="page-body">
        <div class="page-title-block">
            <h1>Controle de Estoque</h1>
            <p>Visão rápida das categorias de produtos da loja Foto Ferrara.</p>
        </div>

        <div class="stock-grid" id="estoqueGrid"></div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/catalogo.js"></script>
    <script src="assets/js/app.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <script>
        document.getElementById('estoqueGrid').innerHTML = Object.entries(CATEGORIAS).map(([k, rotulo]) => {
            const itens = PRODUTOS.filter(p => p.cat === k);
            return `<div class="stock-card premium-card">
                <h3>${escapar(rotulo.toUpperCase())} (${itens.length})</h3>
                ${itens.map(p => `<div class="stock-item"><span>${escapar(p.nome)}</span><small style="color:var(--text-muted);white-space:nowrap">${escapar(precoTexto(p))}</small></div>`).join('')}
                <a class="outline-btn" href="loja.html?cat=${k}">Ver na loja</a>
            </div>`;
        }).join('');
        atualizarIcones();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Ferrara - Controle de Estoque</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fcf9f6;
            --bg-card: #ffffff;
            --text-primary: #2e2520;
            --text-muted: #827167;
            --color-primary: #6f4c3e;
            --color-accent: #a16644;
            --color-gold: #d4af37;
            --color-hover: #f7ede2;
            --border-color: #ebdcd0;
            --shadow-subtle: 0 10px 30px rgba(111, 76, 62, 0.05);
            --shadow-medium: 0 16px 40px rgba(111, 76, 62, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        header.premium-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-subtle);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-symbol {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--color-primary);
            text-decoration: none;
        }

        .logo-text span {
            color: var(--color-gold);
            font-weight: 300;
        }

        nav.header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav.header-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        nav.header-nav a:hover {
            color: var(--color-primary);
            background-color: var(--color-hover);
        }

        nav.header-nav a.active-link {
            color: var(--color-primary);
            background-color: var(--color-hover);
            border: 1px solid var(--border-color);
        }

        .main-container {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .premium-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-medium);
            border: 1px solid rgba(235, 220, 208, 0.5);
            margin-bottom: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 24px;
            border-bottom: 2px solid var(--color-hover);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Buttons styling */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-primary);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(111, 76, 62, 0.15);
        }

        .btn:hover {
            background-color: var(--color-accent);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(111, 76, 62, 0.25);
        }

        .btn.danger {
            background-color: #b33939;
            box-shadow: 0 4px 10px rgba(179, 57, 57, 0.15);
        }

        .btn.danger:hover {
            background-color: #d14242;
            box-shadow: 0 6px 14px rgba(179, 57, 57, 0.25);
        }

        .btn.secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .btn.secondary:hover {
            background-color: var(--color-hover);
            color: var(--color-primary);
        }

        /* Forms Styling */
        form p {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        form label {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
        }

        form input, form textarea, form select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font-family);
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus, form textarea:focus, form select:focus {
            border-color: var(--color-accent);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(161, 102, 68, 0.15);
        }

        /* Table design */
        .sf-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-top: 16px;
        }

        .sf-table th {
            background-color: #f7ede2;
            color: var(--color-primary);
            font-weight: 600;
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .sf-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-primary);
            background-color: #fff;
            transition: background-color 0.2s ease;
        }

        .sf-table tr:last-child td {
            border-bottom: none;
        }

        .sf-table tr:hover td {
            background-color: var(--bg-primary);
        }

        .sf-table tr.low td {
            background-color: #fff5f2;
            color: #b33939;
        }

        .sf-table tr.low:hover td {
            background-color: #ffebe6;
        }

        .sf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid rgba(235, 220, 208, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card .big {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .card.warning {
            border-left: 4px solid var(--color-accent);
        }

        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-card);
        }

        /* Top header actions container */
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header class="premium-header">
        <div class="logo-container">
            <div class="logo-symbol">F</div>
            <a href="/" class="logo-text">Foto<span>Ferrara</span></a>
        </div>
        <nav class="header-nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/estoque/" class="active-link">Estoque</a>
            <a href="/estoque/criar/">Novo Produto</a>
            <a href="/dashboard.html#config">Configurações</a>
        </nav>
    </header>

    <main class="main-container">
        <div class="premium-card">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Foto Ferrara - Gestão Profissional & Controle de Estoque Premium
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - FotoFerrara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/theme.css">

    <style>
        body { min-height: 100vh; }

        .auth-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .auth-card h1 {
            font-size: 30px;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .auth-card > p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .form {
            width: 100%;
            text-align: left;
        }

        .form button.primary-btn {
            width: 100%;
            margin-top: 6px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="animated-view">
    <header class="site-header">
        <a href="HomePage - Fotoferrara.html" class="logo">
            <div class="logo-box"><i data-lucide="camera"></i></div>
            <span class="logo-text">Foto<span>Ferrara</span></span>
        </a>
        <nav class="site-nav">
            <a href="#">Impressões de fotos</a>
            <a href="#">Molduras e Decoração</a>
            <a href="#">Acessórios</a>
            <a href="#">Contate-nos</a>
            <a href="Login - Fotoferrara.html" class="primary-btn">Minha Conta</a>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card premium-card">
            <h1>Cadastre-se</h1>
            <p>Junte-se à comunidade de amantes da fotografia do FotoFerrara hoje mesmo!</p>
            <form id="cadastroForm" class="form">
                <div class="form-group">
                    <label for="cadastroNome">Nome completo</label>
                    <input type="text" id="cadastroNome" placeholder="Nome Completo" required>
                </div>
                <div class="form-group">
                    <label for="cadastroEmail">E-mail</label>
                    <input type="email" id="cadastroEmail" placeholder="Digite seu e-mail" required>
                </div>
                <div class="form-group">
                    <label for="cadastroSenha">Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Senha" required>
                </div>
                <div class="form-group">
                    <label for="cadastroConfirmarSenha">Confirmar senha</label>
                    <input type="password" id="cadastroConfirmarSenha" placeholder="Digite novamente a senha" required>
                </div>
                <button class="primary-btn" type="submit">Cadastrar-se</button>
            </form>
            <div class="login-link">
                <p>Já tem uma conta? <a href="Login - Fotoferrara.html">Entrar</a></p>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        &copy; 2026 FotoFerrara - Todos os direitos reservados
    </footer>

    <script src="Cadastro-Login_FotoFerrara.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

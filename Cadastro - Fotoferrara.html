<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - FotoFerrara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/theme.css">

    <style>
        body { min-height: 100vh; }

        .auth-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .auth-card h1 {
            font-size: 30px;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .auth-card > p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .form {
            width: 100%;
            text-align: left;
        }

        .form button.primary-btn {
            width: 100%;
            margin-top: 6px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="animated-view">
    <div id="site-header"></div>

    <div class="auth-wrapper">
        <div class="auth-card premium-card">
            <h1>Cadastre-se</h1>
            <p>Junte-se à comunidade de amantes da fotografia do FotoFerrara hoje mesmo!</p>
            <form id="cadastroForm" class="form" novalidate>
                <div class="form-grid">
                    <h3 class="form-section-title">Dados pessoais</h3>
                    <div class="form-group col-6"><label for="cadastroNome">Nome completo</label><input type="text" id="cadastroNome" placeholder="Nome Completo" required></div>
                    <div class="form-group col-3"><label for="cadastroEmail">E-mail</label><input type="email" id="cadastroEmail" placeholder="Digite seu e-mail" required></div>
                    <div class="form-group col-3"><label for="cadastroTelefone">Telefone</label><input type="tel" id="cadastroTelefone" placeholder="(11) 99999-9999" required></div>
                    <div class="form-group col-3"><label for="cadastroCpf">CPF</label><input type="text" id="cadastroCpf" placeholder="000.000.000-00" required></div>
                    <div class="form-group col-3"></div>
                    <h3 class="form-section-title">Endereço de entrega</h3>
                    <div class="form-group col-2"><label for="cadastroCep">CEP</label><input type="text" id="cadastroCep" placeholder="00000-000" required></div>
                    <div class="form-group col-4"><label for="cadastroRua">Rua</label><input type="text" id="cadastroRua" required></div>
                    <div class="form-group col-2"><label for="cadastroNumero">Número</label><input type="text" id="cadastroNumero" required></div>
                    <div class="form-group col-4"><label for="cadastroComplemento">Complemento</label><input type="text" id="cadastroComplemento" placeholder="Apto, bloco... (opcional)"></div>
                    <div class="form-group col-3"><label for="cadastroBairro">Bairro</label><input type="text" id="cadastroBairro" required></div>
                    <div class="form-group col-3"><label for="cadastroCidade">Cidade</label><input type="text" id="cadastroCidade" required></div>
                    <div class="form-group col-2"><label for="cadastroUf">UF</label><input type="text" id="cadastroUf" maxlength="2" placeholder="SP" required></div>
                    <h3 class="form-section-title">Acesso</h3>
                    <div class="form-group col-3"><label for="cadastroSenha">Senha (mín. 6 caracteres)</label><input type="password" id="cadastroSenha" placeholder="Senha" required></div>
                    <div class="form-group col-3"><label for="cadastroConfirmarSenha">Confirmar senha</label><input type="password" id="cadastroConfirmarSenha" placeholder="Digite novamente a senha" required></div>
                </div>
                <button class="primary-btn" type="submit">Cadastrar-se</button>
            </form>
            <div class="login-link">
                <p>Já tem uma conta? <a href="Login - Fotoferrara.html" id="linkEntrar">Entrar</a></p>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/js/app.js"></script>
    <script src="Cadastro-Login_FotoFerrara.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

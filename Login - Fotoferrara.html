<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FotoFerrara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="assets/css/theme.css">

    <style>
        body { min-height: 100vh; }

        .auth-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .auth-card h1 {
            font-size: 30px;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .auth-card > p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .form {
            width: 100%;
            text-align: left;
        }

        .form a.forgot {
            display: block;
            text-align: right;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .form a.forgot:hover {
            color: var(--color-accent);
        }

        .form button.primary-btn {
            width: 100%;
            margin-top: 4px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="animated-view">
    <div id="site-header"></div>

    <div class="auth-wrapper">
        <div class="auth-card premium-card">
            <h1>Entrar</h1>
            <div class="notice" id="avisoNext" style="display:none">Entre na sua conta para continuar.</div>
            <p>Junte-se a outros entusiastas da fotografia agora!</p>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>
                </div>
                <div class="form-group">
                    <label for="loginSenha">Senha</label>
                    <input type="password" id="loginSenha" placeholder="Senha" required>
                </div>
                <a href="#" class="forgot" id="esqueceuSenha">Esqueceu sua senha?</a>
                <button class="primary-btn" type="submit">Entrar</button>
            </form>
            <div class="register">
                <p>Não tem uma conta? <a href="Cadastro - Fotoferrara.html" id="linkCriarConta">Criar Nova Conta</a></p>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/js/app.js"></script>
    <script src="Cadastro-Login_FotoFerrara.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
